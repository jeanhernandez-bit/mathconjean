name: Actualizar lista de materiales
on:
  push:
    paths: ["**/*.pdf", "tools/generar_lista.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lista:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/generar_lista.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add materiales.json
          git diff --cached --quiet || (git commit -m "Actualizar lista de materiales" && git push)
