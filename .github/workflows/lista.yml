name: Actualizar lista y publicar
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: publicar
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/generar_lista.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add materiales.json version.json
          git diff --cached --quiet || (git commit -m "Actualizar lista de materiales" && git push)
      # Sin claves: GitHub se identifica ante Google (Workload Identity Federation).
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/108727229400/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@mathconjean.iam.gserviceaccount.com
      - name: Publicar en Firebase Hosting
        run: npx --yes firebase-tools deploy --only hosting --project mathconjean --non-interactive
